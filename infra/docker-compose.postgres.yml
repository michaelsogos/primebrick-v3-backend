# Local PostgreSQL 18 — Docker Desktop (Windows) or Docker Engine (WSL2).
#
# If you see "dockerDesktopLinuxEngine" / "Impossibile trovare il file":
#   start Docker Desktop and wait until it is fully running, then retry.
#   Or run this compose from a WSL shell if Docker is only installed there.
#
# From backend repo root:
#   docker compose -f infra/docker-compose.postgres.yml up -d
# Stop:
#   docker compose -f infra/docker-compose.postgres.yml down
#
# Persistence: data lives in Docker named volume "primebrick_pg18_data" (see below).
#   Survives: container stop/start, compose down (without -v), PC reboot.
#   Wiped by:  compose down -v, docker volume rm primebrick_pg18_data, Docker reset
#             "Remove all data", or pruning volumes intentionally.
#
# PG 18+ image: mount must be /var/lib/postgresql (not …/data). If you first ran
# an older compose that used …/data, remove the volume once then recreate:
#   docker compose -f infra/docker-compose.postgres.yml down -v
#   docker compose -f infra/docker-compose.postgres.yml up -d
#
# DBeaver "Connection refused" on localhost:5432:
#   1) docker ps -a  → STATUS must be "Up". If Exited: docker logs primebrick-postgres-18
#   2) docker port primebrick-postgres-18  → must list 127.0.0.1:…->5432/tcp
#   3) Another app may own 5432 on Windows (local PostgreSQL). Stop it or set PG_HOST_PORT=5433
#      in .env (repo root or this folder), recreate: compose down && compose up -d
#   4) In DBeaver use host 127.0.0.1 (not "localhost").

services:
  postgres:
    image: postgres:18-bookworm
    container_name: primebrick-postgres-18
    environment:
      POSTGRES_USER: primebrick
      POSTGRES_PASSWORD: primebrick_dev
      POSTGRES_DB: primebrick
    ports:
      # Bind only on loopback; avoids some IPv6/localhost quirks on Windows.
      # Override port: create .env with PG_HOST_PORT=5433 (if 5432 is already taken).
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      # PG 18+ requires this path so data lives in a versioned subdir (see postgres Docker README).
      - primebrick_pg18_data:/var/lib/postgresql

    # --- TRUCCO DI BOOTSTRAP PER INSTALARE ED AVVIARE PG_PARTMAN ---
    entrypoint: >
      bash -c "
      echo '=== Aggiornamento e Installazione pg_partman ===' &&
      apt-get update && apt-get install -y postgresql-18-partman &&
      echo '=== Avvio di PostgreSQL con le librerie condivise ===' &&
      exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_partman_bgw
      "
            
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primebrick -d primebrick"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - primebrick-infra-net

  casdoor:
    image: casbin/casdoor:3.118.0
    container_name: primebrick-casdoor
    environment:
      driverName: postgres
      # Indichiamo a Casdoor il DB target 'casdoor'
      dataSourceName: "user=primebrick password=primebrick_dev host=postgres port=5432 sslmode=disable dbname=casdoor"
      runmode: dev
      httpport: "8000"
    ports:
      - "127.0.0.1:${CASDOOR_HOST_PORT:-8000}:8000"
    volumes:
      # Named volume for Casdoor static data (uploaded files, configs).
      # Survives container restarts.
      - primebrick_casdoor_data:/data
      # Bind-mount app.conf from host so custom edits (origin=, originFrontend=)
      # survive image upgrades. Env vars in this compose file still override
      # DB-related keys at runtime.
      - ./casdoor-conf/app.conf:/conf/app.conf
    # Casdoor will create the database automatically if it doesn't exist
    entrypoint: /bin/sh -c "./server --createDatabase=true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - primebrick-infra-net

  nats:
    image: nats:latest
    container_name: primebrick-nats
    command: "-js"
    ports:
      # Bind only on loopback; avoids some IPv6/localhost quirks on Windows.
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITORING_PORT:-8222}:8222"
    volumes:
      - primebrick_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/varz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - primebrick-infra-net

volumes:
  primebrick_pg18_data:
    # Fixed name so the volume is easy to spot and is not tied to the compose project prefix.
    name: primebrick_pg18_data
  primebrick_casdoor_data:
    # Named volume for Casdoor persistence across container restarts.
    name: primebrick_casdoor_data
  primebrick_nats_data:
    # Named volume for NATS JetStream persistence across container restarts.
    name: primebrick_nats_data

networks:
  primebrick-infra-net:
    name: primebrick-infra-net
    driver: bridge
